# main에 올라가면 GitHub Pages로 자동 배포.
# 처음 한 번만: 저장소 Settings → Pages → Source를 "GitHub Actions"로.
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 폰/브라우저가 예전 js, css를 기억해서 옛날 버전이 도는 걸 막는다:
      # 배포할 때마다 파일 주소 뒤에 커밋 번호를 붙인다.
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp -r index.html css js fonts _site/
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"css/[a-z]+\.css)\"#\1?v=$V\"#; s#(src=\"js/[a-z]+\.js)\"#\1?v=$V\"#g" _site/index.html
          grep -nE 'css/|js/' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
